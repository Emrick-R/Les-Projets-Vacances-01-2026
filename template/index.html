<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/assets/index.css">
    <title>{{.Calcul}}</title>
</head>

<body>
    <nav class="navbar">
        <ul class="nav-menu">
            <li><a href="/" class="nav-links">The Convertisseur d'unités</a></li>
        </ul>
    </nav>

    <h1>{{.Calcul}}</h1>
    <p>{{.Message}}</p>
    <p>Choisis une conversion : </p>
    <div class="ligne">
        <div>
            <form action="/" method="post">
                <input type="hidden" name="opération" value="km">
                <button type="submit">Kilomètres/Miles</button>
            </form>
        </div>
        <div>
            <form action="/" method="post">
                <input type="hidden" name="opération" value="kl">
                <button type="submit">kg/livres</button>
            </form>
        </div>
        <div>
            <form action="/" method="post">
                <input type="hidden" name="opération" value="cf">
                <button type="submit">Celsius/Fahrenheit</button>
            </form>
        </div>
    </div>

    <p>Puis calcul :</p>
    <form action="/" method="post" class="centre">
        <div class="ligne">
            <div class="centre">
            <label>{{.Unité1}} :</label><br>
            <input type="number" name="nombre1" value="{{.Valeur1}}">
            </div>
            <button name="direction" value="changer" type="submit">{{.Direction}}</button>

            <div class="centre">
            <label>{{.Unité2}} :</label><br>
            <label>{{.Resultat}}</label><br><br>
            </div>
        </div>
                
        <br><br>
        
        <button value="" type="submit">Calculer !</button>
    </form>    

</body>

</html>
